<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReHero</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById("root").innerHTML =
          '<div style="padding:40px;font-family:monospace;font-size:14px;">' +
          '<h1 style="color:red;font-size:18px;">Startup Error</h1>' +
          '<p>' + (err ? err.name + ': ' + err.message : msg) + '</p>' +
          '<pre style="font-size:12px;opacity:0.5;">' + (err && err.stack || url + ':' + line + ':' + col) + '</pre>' +
          '</div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
